<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{if(!localStorage.getItem("gq.access"))location.replace("./index.html");}catch(e){}</script>
<title>Grammar Quest — Belajar Grammar Bahasa Inggris</title>
<meta name="description" content="Aplikasi belajar grammar Bahasa Inggris untuk anak 7–12 tahun. Menulis, mendengar, dan berbicara dengan audio. Bisa dipakai offline.">
<meta name="theme-color" content="#12313F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Grammar Quest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6F1EF;
  --paper-2:#D6E8E6;
  --surface:#FFFFFF;
  --surface-2:#F4FAF9;
  --ink:#12313F;
  --ink-2:#4A6B78;
  --line:#C9DEDB;
  --mango:#FFB020;
  --coral:#FF6B5A;
  --grape:#7C5CFF;
  --leaf:#2FB37A;
  --sky:#3AA7E0;
  --shadow:0 6px 0 rgba(18,49,63,.14);
  --shadow-soft:0 10px 30px rgba(18,49,63,.10);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --display:'Fredoka',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --body:'Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E2029; --paper-2:#0A1A22; --surface:#16333F; --surface-2:#122B35;
    --ink:#EAF6F4; --ink-2:#9DBDC6; --line:#28505F;
    --shadow:0 6px 0 rgba(0,0,0,.35); --shadow-soft:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#0E2029; --paper-2:#0A1A22; --surface:#16333F; --surface-2:#122B35;
  --ink:#EAF6F4; --ink-2:#9DBDC6; --line:#28505F;
  --shadow:0 6px 0 rgba(0,0,0,.35); --shadow-soft:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); color:var(--ink); background:var(--paper);
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  min-height:100dvh;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
:focus-visible{outline:3px solid var(--grape); outline-offset:3px; border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.app{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
.screen{display:none;flex:1;flex-direction:column;padding:16px 16px 110px}
.screen.on{display:flex}
h1,h2,h3,.dsp{font-family:var(--display);font-weight:600;letter-spacing:.1px;margin:0}
.muted{color:var(--ink-2)}

/* ---------- Chunky buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--display);font-size:17px;font-weight:600;
  padding:14px 22px;border-radius:999px;background:var(--surface);
  box-shadow:var(--shadow);transition:transform .12s ease, box-shadow .12s ease;
  border:2px solid var(--line);
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(18,49,63,.14)}
.btn.primary{background:var(--mango);border-color:#E09400;color:#3A2600;box-shadow:0 6px 0 #C97F00}
.btn.primary:active{box-shadow:0 2px 0 #C97F00}
.btn.go{background:var(--leaf);border-color:#1E8F5E;color:#fff;box-shadow:0 6px 0 #1B7A51}
.btn.go:active{box-shadow:0 2px 0 #1B7A51}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;font-size:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}

/* ---------- Onboarding ---------- */
.ob{justify-content:center;align-items:center;text-align:center;gap:6px;padding:28px 20px 40px}
.ob .logo{font-family:var(--display);font-weight:700;font-size:clamp(38px,11vw,60px);line-height:.95;color:var(--ink)}
.ob .logo em{font-style:normal;display:block;color:var(--coral)}
.ob p{max-width:34ch;line-height:1.55;color:var(--ink-2);margin:6px 0 4px}
.namefield{
  width:100%;max-width:340px;font-family:var(--display);font-size:22px;text-align:center;
  padding:16px;border-radius:var(--r-md);border:3px dashed var(--line);
  background:var(--surface);color:var(--ink);margin:8px 0 4px;
}
.namefield::placeholder{color:var(--ink-2);opacity:.6}
.pickrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0 2px}
.pick{
  width:88px;padding:10px 6px 8px;border-radius:var(--r-md);background:var(--surface);
  border:3px solid transparent;box-shadow:var(--shadow-soft);
}
.pick svg{width:56px;height:56px;display:block;margin:0 auto}
.pick span{display:block;font-family:var(--display);font-size:13px;margin-top:4px}
.pick[aria-pressed="true"]{border-color:var(--leaf);background:var(--surface-2)}
.steps{display:flex;gap:6px;margin-top:18px}
.steps i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.steps i.on{background:var(--coral);width:22px;border-radius:5px}

/* ---------- Top bar ---------- */
.top{display:flex;align-items:center;gap:10px;padding:6px 2px 14px}
.top .who{flex:1;min-width:0}
.top .who b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.top .who small{color:var(--ink-2);font-size:13px}
.avatar-sm{width:48px;height:48px;border-radius:50%;background:var(--surface);border:3px solid var(--line);flex:none;display:grid;place-items:center;overflow:hidden}
.avatar-sm svg{width:40px;height:40px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:2px solid var(--line);
  border-radius:999px;padding:6px 11px;font-family:var(--display);font-size:14px;font-weight:600}
.pill.star{color:#B77900}
.pill.fire{color:var(--coral)}

/* ---------- Mascot bubble ---------- */
.mascot{display:flex;gap:10px;align-items:flex-end;margin:0 0 16px}
.mascot .ch{width:76px;height:76px;flex:none}
.mascot .ch svg{width:100%;height:100%;display:block}
.bubble{
  background:var(--surface);border:2px solid var(--line);border-radius:20px 20px 20px 6px;
  padding:12px 15px;font-size:15px;line-height:1.45;box-shadow:var(--shadow-soft);flex:1
}
.bubble b{font-family:var(--display)}

/* ---------- Trail map ---------- */
.levelhead{display:flex;align-items:center;gap:10px;margin:22px 0 6px}
.levelhead .tag{font-family:var(--display);font-size:13px;padding:5px 12px;border-radius:999px;color:#fff}
.levelhead h2{font-size:22px}
.levelhead small{color:var(--ink-2);font-size:13px;display:block;font-family:var(--body)}
.trail{position:relative;padding:14px 0 6px}
.trail::before{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:14px;margin-left:-7px;
  background:repeating-linear-gradient(180deg,var(--line) 0 16px,transparent 16px 30px);border-radius:8px;
}
.stone{position:relative;display:flex;align-items:center;gap:12px;margin:0 0 16px;width:100%}
.stone.right{flex-direction:row-reverse;text-align:right}
.stone .dot{
  width:74px;height:74px;flex:none;border-radius:50%;background:var(--surface);
  border:4px solid var(--line);display:grid;place-items:center;font-size:30px;
  box-shadow:var(--shadow);position:relative;z-index:1;transition:transform .15s
}
.stone:active .dot{transform:translateY(4px)}
.stone .meta{flex:1;min-width:0}
.stone .meta b{font-family:var(--display);font-size:17px;display:block;line-height:1.2}
.stone .meta small{color:var(--ink-2);font-size:13px}
.stone .stars{margin-top:5px;font-size:13px;letter-spacing:2px;color:var(--mango)}
.stone.done .dot{background:var(--leaf);border-color:#1E8F5E;color:#fff}
.stone.now .dot{border-color:var(--coral);animation:bob 2.2s ease-in-out infinite}
.stone.locked{opacity:.5}
.stone.locked .dot{background:var(--paper-2)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ---------- Unit screen ---------- */
.unittop{display:flex;align-items:center;gap:10px;padding:4px 0 12px;position:sticky;top:0;background:var(--paper);z-index:5}
.back{width:42px;height:42px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:20px;flex:none}
.pbar{flex:1;height:14px;border-radius:999px;background:var(--paper-2);overflow:hidden;border:2px solid var(--line)}
.pbar i{display:block;height:100%;background:var(--leaf);width:0;transition:width .35s cubic-bezier(.2,.9,.3,1)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;font-family:var(--display);font-size:14px;padding:9px 14px;border-radius:999px;
  background:var(--surface);border:2px solid var(--line)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab.locked{opacity:.45}

.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-soft);margin-bottom:14px}
.card h3{font-size:19px;margin-bottom:6px}
.rule{border-left:6px solid var(--grape);padding:2px 0 2px 13px;margin:14px 0}
.rule b{font-family:var(--display);font-size:16px}
.rule p{margin:4px 0 0;font-size:15px;line-height:1.5;color:var(--ink-2)}
.exline{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:var(--r-sm);
  padding:10px 12px;margin:8px 0;border:1px solid var(--line)}
.exline .en{font-family:var(--display);font-size:16px;flex:1}
.exline .idn{display:block;font-family:var(--body);font-size:13px;color:var(--ink-2);font-weight:600}
.spk{width:38px;height:38px;flex:none;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;
  box-shadow:0 4px 0 #2A82B0;font-size:17px}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #2A82B0}
.spk.big{width:84px;height:84px;font-size:34px;box-shadow:0 7px 0 #2A82B0}
.spk.rec{background:var(--coral);box-shadow:0 7px 0 #D14A3B}
.spk.rec.live{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

.qnum{font-family:var(--display);font-size:13px;color:var(--ink-2)}
.qtext{font-family:var(--display);font-size:21px;line-height:1.45;margin:8px 0 16px}
.blank{display:inline-block;min-width:70px;border-bottom:4px dotted var(--coral);text-align:center}
.opts{display:grid;gap:10px}
.opt{text-align:left;font-family:var(--display);font-size:17px;padding:14px 16px;border-radius:var(--r-md);
  background:var(--surface-2);border:2px solid var(--line);box-shadow:var(--shadow);transition:transform .1s}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(18,49,63,.14)}
.opt.right{background:#D9F5E7;border-color:var(--leaf);color:#0C5138}
.opt.wrong{background:#FFE2DE;border-color:var(--coral);color:#7A2318}
.opt.dim{opacity:.5}

.answerbox{width:100%;font-family:var(--display);font-size:20px;padding:14px;border-radius:var(--r-md);
  border:3px solid var(--line);background:var(--surface-2);color:var(--ink);text-align:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.chip{font-family:var(--display);font-size:16px;padding:10px 15px;border-radius:14px;background:var(--surface-2);
  border:2px solid var(--line);box-shadow:var(--shadow)}
.chip:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(18,49,63,.14)}
.chip.used{opacity:.3;pointer-events:none}
.slot{min-height:62px;border:3px dashed var(--line);border-radius:var(--r-md);padding:10px;display:flex;
  flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface-2)}
.slot:empty::after{content:"Susun kalimatnya di sini";color:var(--ink-2);font-size:14px;opacity:.8}

.feedback{border-radius:var(--r-md);padding:13px 15px;margin-top:14px;font-size:15px;line-height:1.5;display:none}
.feedback.on{display:block}
.feedback.good{background:#D9F5E7;color:#0C5138}
.feedback.bad{background:#FFE2DE;color:#7A2318}
.feedback b{font-family:var(--display);display:block;font-size:17px;margin-bottom:2px}

.scorebar{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0 2px;flex-wrap:wrap}
.meter{height:16px;border-radius:999px;background:var(--paper-2);flex:1;min-width:140px;overflow:hidden;border:2px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--mango),var(--leaf));width:0;transition:width .5s}

.done-wrap{text-align:center;padding:22px 6px}
.done-wrap .big{font-size:64px;line-height:1}
.done-wrap h2{font-size:28px;margin:10px 0 4px}
.starrow{font-size:40px;letter-spacing:6px;color:var(--line)}
.starrow .lit{color:var(--mango);text-shadow:0 3px 0 #C97F00}

/* ---------- Bottom nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--paper) 42%)}
.nav .inner{display:flex;gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:999px;
  padding:6px;box-shadow:var(--shadow-soft);max-width:420px;width:100%}
.nav button{flex:1;border-radius:999px;padding:9px 4px;font-family:var(--display);font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-2)}
.nav button span{font-size:19px;line-height:1}
.nav button.on{background:var(--ink);color:var(--paper)}

/* ---------- Profile / badges ---------- */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 16px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:13px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:25px;line-height:1.1}
.stat small{font-size:11.5px;color:var(--ink-2)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:12px 6px;text-align:center}
.badge .ic{font-size:30px;filter:grayscale(1);opacity:.35}
.badge.got .ic{filter:none;opacity:1}
.badge small{display:block;font-family:var(--display);font-size:11.5px;margin-top:4px;line-height:1.25}
.setrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);
  border-radius:var(--r-md);padding:13px 15px;margin-bottom:10px}
.setrow .lb{flex:1}
.setrow .lb b{font-family:var(--display);font-size:15px;display:block}
.setrow .lb small{color:var(--ink-2);font-size:12.5px}
.toggle{width:54px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"]{background:var(--leaf)}
.toggle[aria-pressed="true"] i{left:27px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:999px;font-family:var(--display);
  font-size:15px;z-index:60;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}

.note{font-size:13px;color:var(--ink-2);line-height:1.5;text-align:center;padding:4px 10px}
@media(min-width:620px){ .screen{padding:20px 24px 120px} .stone .dot{width:84px;height:84px;font-size:34px} }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ================= KURIKULUM =================
   Disusun mengikuti tahapan Cambridge English Young Learners
   (Pre A1 Starters / A1 Movers / A2 Flyers) dan capaian pembelajaran
   Bahasa Inggris Fase B–C Kurikulum Merdeka (kelas 2–6 SD). */
const LEVELS = [
{
 id:'L1', name:'Pulau Matahari', cefr:'Pre A1 Starters', age:'7–8 tahun', color:'#2FB37A',
 blurb:'Kata benda, kata ganti, dan kata kerja "to be".',
 units:[
 {
  id:'u1', icon:'🍎', title:'A, An & Plural', titleId:'Kata benda tunggal dan jamak',
  goal:'Memakai a / an dan menambah -s untuk benda lebih dari satu.',
  rules:[
   {b:'a atau an?', p:'Pakai <b>a</b> sebelum bunyi konsonan: a book, a dog. Pakai <b>an</b> sebelum bunyi vokal a, i, u, e, o: an apple, an egg, an umbrella.'},
   {b:'Lebih dari satu → tambah -s', p:'one book → two book<b>s</b>. one cat → three cat<b>s</b>.'},
   {b:'Kalau berakhiran -s, -x, -ch, -sh → tambah -es', p:'one bus → two bus<b>es</b>, one box → six box<b>es</b>, one watch → two watch<b>es</b>.'},
   {b:'Jamak tak beraturan', p:'man → men, woman → women, child → children, foot → feet, mouse → mice, tooth → teeth.'}
  ],
  ex:[{en:'I have a red ball.',id:'Saya punya sebuah bola merah.'},
      {en:'She eats an orange every day.',id:'Dia makan sebuah jeruk setiap hari.'},
      {en:'There are five books on the table.',id:'Ada lima buku di atas meja.'},
      {en:'Two children are playing outside.',id:'Dua anak sedang bermain di luar.'}],
  listen:[
   {say:'I have an umbrella.', q:'Kalimat mana yang kamu dengar?', o:['I have a umbrella.','I have an umbrella.','I have umbrellas.'], a:1},
   {say:'There are three boxes.', q:'Berapa banyak kotaknya?', o:['Satu kotak','Dua kotak','Tiga kotak'], a:2},
   {say:'My friend has two watches.', q:'Kata benda jamak yang kamu dengar adalah…', o:['watch','watches','watched'], a:1}
  ],
  write:[
   {t:'fill', s:'I see ___ elephant at the zoo.', a:['an'], bank:['a','an'], id:'Saya melihat seekor gajah di kebun binatang.'},
   {t:'fill', s:'There are six ___ in the garden. (flower)', a:['flowers'], id:'Ada enam bunga di taman.'},
   {t:'fill', s:'My mother buys three ___ . (dress)', a:['dresses'], id:'Ibu saya membeli tiga gaun.'},
   {t:'order', w:['a','is','This','banana','yellow'], a:'This is a yellow banana.', id:'Ini adalah pisang kuning.'}
  ],
  speak:[{en:'I have an apple and two bananas.',id:'Saya punya sebuah apel dan dua pisang.'},
         {en:'There are many children in the park.',id:'Ada banyak anak di taman.'},
         {en:'She has a new pencil box.',id:'Dia punya sebuah kotak pensil baru.'}],
  quiz:[
   {q:'Mira has ___ orange bag.', o:['a','an','the'], a:1, why:'Bunyi awal "orange" adalah vokal /o/, jadi pakai an.'},
   {q:'Jamak dari "child" adalah…', o:['childs','childes','children'], a:2, why:'child adalah jamak tak beraturan → children.'},
   {q:'I brush my ___ every morning.', o:['tooths','teeth','tooth'], a:1, why:'Kita punya banyak gigi, jamak dari tooth adalah teeth.'},
   {q:'Mana yang benar?', o:['two bus','two buss','two buses'], a:2, why:'Kata berakhiran -s ditambah -es → buses.'}
  ]
 },
 {
  id:'u2', icon:'👧', title:'Subject Pronouns', titleId:'Kata ganti orang',
  goal:'Mengganti nama orang atau benda dengan I, you, he, she, it, we, they.',
  rules:[
   {b:'Untuk diri sendiri dan lawan bicara', p:'<b>I</b> = saya (selalu huruf besar). <b>You</b> = kamu / kalian. <b>We</b> = kami.'},
   {b:'Untuk orang lain', p:'<b>He</b> = dia laki-laki. <b>She</b> = dia perempuan. <b>They</b> = mereka.'},
   {b:'Untuk benda dan hewan', p:'Pakai <b>it</b>: The book is new → <b>It</b> is new.'},
   {b:'Kata ganti milik', p:'my, your, his, her, its, our, their. Contoh: This is <b>her</b> bag.'}
  ],
  ex:[{en:'Rudi is my friend. He is kind.',id:'Rudi teman saya. Dia baik.'},
      {en:'Sinta likes cats. She has three cats.',id:'Sinta suka kucing. Dia punya tiga kucing.'},

const KEY='grammarquest.v1';
const DEFAULT={name:'',char:'fox',xp:0,stars:{},prog:{},streak:0,last:'',sound:true,rate:0.82,accent:'en-US',unlockAll:false,speakDone:0,perfect:0};
let S = Object.assign({},DEFAULT);
function load(){ try{const r=localStorage.getItem(KEY); if(r) S=Object.assign({},DEFAULT,JSON.parse(r));}catch(e){} }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
load();

const ALLUNITS = LEVELS.flatMap(l=>l.units.map(u=>({...u,lvl:l})));
const findUnit = id => ALLUNITS.find(u=>u.id===id);
function secDone(uid,sec){ return !!(S.prog[uid]&&S.prog[uid][sec]); }
function markDone(uid,sec){ S.prog[uid]=S.prog[uid]||{}; S.prog[uid][sec]=1; save(); }
function unitPct(uid){ const p=S.prog[uid]||{}; return Math.round(['learn','listen','write','speak','quiz'].filter(k=>p[k]).length/5*100); }
function unitOpen(uid){
  if(S.unlockAll) return true;
  const i=ALLUNITS.findIndex(u=>u.id===uid);
  if(i<=0) return true;
  return secDone(ALLUNITS[i-1].id,'quiz');
}
function totalStars(){ return Object.values(S.stars).reduce((a,b)=>a+b,0); }
function unitsDone(){ return ALLUNITS.filter(u=>secDone(u.id,'quiz')).length; }
function touchStreak(){
  const t=new Date().toDateString();
  if(S.last===t) return;
  const y=new Date(Date.now()-864e5).toDateString();
  S.streak = (S.last===y)? S.streak+1 : 1;
  S.last=t; save();
}

/* ================= AUDIO ================= */
let AC=null;
function beep(type){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const seq = type==='good'? [[660,0],[880,.09],[1180,.18]] : type==='bad'? [[300,0],[220,.12]] : [[520,0],[780,.08],[1040,.16],[1320,.26]];
    seq.forEach(([f,t])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type= type==='bad'?'sawtooth':'triangle'; o.frequency.value=f;
      o.connect(g); g.connect(AC.destination);
      const s=AC.currentTime+t;
      g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(.18,s+.02);
      g.gain.exponentialRampToValueAtTime(.0001,s+.22);
      o.start(s); o.stop(s+.24);
    });
  }catch(e){}
}
let VOICES=[];
function loadVoices(){ try{VOICES=speechSynthesis.getVoices()||[];}catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function pickVoice(){
  if(!VOICES.length) loadVoices();
  const want=S.accent;
  return VOICES.find(v=>v.lang&&v.lang.replace('_','-')===want)
      || VOICES.find(v=>v.lang&&v.lang.toLowerCase().startsWith('en'))||null;
}
function say(text, opts){
  if(!('speechSynthesis' in window)){ toast('Perangkat ini belum mendukung suara.'); return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(); if(v) u.voice=v;
    u.lang=S.accent; u.rate=(opts&&opts.slow)?Math.max(.5,S.rate-.25):S.rate; u.pitch=1.07;
    if(opts&&opts.onend) u.onend=opts.onend;
    speechSynthesis.speak(u);
  }catch(e){}
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200);
}
function confetti(){
  const box=document.createElement('div'); box.className='confetti';
  const cols=['#FFB020','#FF6B5A','#7C5CFF','#2FB37A','#3AA7E0'];
  for(let i=0;i<46;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'vw'; p.style.top='-20px';
    p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    p.style.animationDelay=(Math.random()*.5)+'s';
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(),3400);
}
const norm = s => (s||'').toLowerCase().replace(/[.,!?;:"“”'’]/g,' ').replace(/\s+/g,' ').trim();
const tight = s => (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const same = (a,b) => norm(a)===norm(b) || tight(a)===tight(b);
function addXP(n){ S.xp+=n; save(); }

function nextOrFinish(u,sec,total,label){

  else finishSection(u,sec,total,label);
}
function finishSection(u,sec,total,label){
  markDone(u.id,sec); setProgress();
  const pct=Math.round(ex.right/total*100);
  if(sec==='quiz'){
    const st = pct>=90?3 : pct>=70?2 : 1;
    if((S.stars[u.id]||0)<st){ S.stars[u.id]=st; }
    if(pct===100) S.perfect++;
    save();
  }
  const nextTabIdx=TABS.findIndex(t=>t[0]===sec)+1;
  const nextTab=TABS[nextTabIdx];
  const st=S.stars[u.id]||0;
  beep('win'); if(pct>=70) confetti();
  const nu=ALLUNITS[ALLUNITS.findIndex(x=>x.id===u.id)+1];
  body().innerHTML=`<div class="card done-wrap">

}

    inp.onkeydown=e=>{ if(e.key==='Enter') document.getElementById('check').click(); };
    const full=()=>q.s.replace('___',q.a[0]).replace(/\s*\([^)]*\)/g,'').replace(/\s+([.,?!])/g,'$1').trim();
    document.getElementById('hear').onclick=()=>say(full());
    document.getElementById('check').onclick=()=>{
      if(ex.answered){ nextOrFinish(u,'write',u.write.length,'Latihan menulis'); return; }
      const v=norm(inp.value);
      if(!v){ toast('Tulis jawabanmu dulu ya.'); return; }
      const ok=q.a.some(x=>same(x,inp.value));
      ex.answered=true; showWriteFB(ok,full(),q.a[0],u);
    };
  } else {
    const chips=q.w.map((w,i)=>({w,i})).sort(()=>Math.random()-.5);
    body().innerHTML=`<div class="card">
      ${head}
      <div class="qtext" style="font-size:18px">Susun menjadi kalimat yang benar</div>
      <p class="muted" style="font-size:14px;margin:-8px 0 12px">Artinya: ${q.id}</p>
      <div class="slot" id="slot"></div>
      <div class="bank" id="bank">${chips.map(c=>`<button class="chip" data-i="${c.i}">${c.w}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn" id="undo">↩ Hapus</button>
        <button class="btn primary" id="check" style="flex:1">Periksa</button>
      </div>
    </div>`;
    const slot=document.getElementById('slot'); const picked=[];
    const redraw=()=>{ slot.innerHTML=picked.map(p=>`<span class="chip" style="box-shadow:none">${q.w[p]}</span>`).join(''); };
    body().querySelectorAll('#bank .chip').forEach(c=>c.onclick=()=>{
      if(ex.answered) return; c.classList.add('used'); picked.push(+c.dataset.i); redraw(); beep();
    });
    document.getElementById('undo').onclick=()=>{
      if(ex.answered||!picked.length) return;
      const last=picked.pop(); redraw();
      const el=body().querySelector(`#bank .chip[data-i="${last}"]`); if(el) el.classList.remove('used');
    };
    document.getElementById('check').onclick=()=>{
      if(ex.answered){ nextOrFinish(u,'write',u.write.length,'Latihan menulis'); return; }
      if(!picked.length){ toast('Susun kalimatnya dulu ya.'); return; }
      const made=picked.map(p=>q.w[p]).join(' ');
      const ok=same(made,q.a);
      ex.answered=true; showWriteFB(ok,q.a,q.a,u);
    };
  }
}
function showWriteFB(ok,full,ansWord,u){
  const fb=document.getElementById('fb');
  fb.className='feedback on '+(ok?'good':'bad');
  fb.innerHTML=`<b>${ok?'Benar, '+S.name+'!':'Jawaban yang tepat: '+ansWord}</b>${full}`;
  if(ok){ ex.right++; addXP(10); beep('good'); } else beep('bad');
  say(full);
  document.getElementById('check').textContent='Lanjut';
  document.getElementById('check').classList.remove('primary'); document.getElementById('check').classList.add('go');
}

/* ---------- 4. Bicara ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function similarity(said,target){
  const a=norm(said).split(' ').filter(Boolean), b=norm(target).split(' ').filter(Boolean);
  if(!b.length) return 0;
  const pool=[...a]; let hit=0;
  b.forEach(w=>{ const k=pool.indexOf(w); if(k>-1){hit++; pool.splice(k,1);} });
  return Math.round(hit/b.length*100);
}
function vSpeak(u){
  const q=u.speak[ex.i];
  body().innerHTML=`<div class="card" style="text-align:center">
     <div class="qnum">Kalimat ${ex.i+1} dari ${u.speak.length}</div>
     <div class="qtext" style="margin-top:10px">${q.en}</div>
     <p class="muted" style="font-size:14px;margin:-8px 0 14px">${q.id}</p>
     <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
       <button class="btn" id="hear">🔊 Dengarkan</button>
       <button class="btn ghost" id="slow">🐢 Pelan</button>
     </div>
     <p class="muted" style="font-size:14px;margin:18px 0 10px">Sekarang giliranmu. Tekan mikrofon lalu ucapkan dengan jelas.</p>
     <button class="spk big rec" id="mic" aria-label="Rekam suara">🎤</button>
     <div id="heard" class="muted" style="font-size:14px;margin-top:12px;min-height:20px"></div>
     <div class="scorebar"><div class="meter"><i id="mtr"></i></div><b id="pct" style="font-family:var(--display)">—</b></div>
     <div class="feedback" id="fb"></div>
     <button class="btn primary wide" id="next" style="margin-top:14px;display:none">Lanjut</button>
   </div>
   ${SR?'':'<p class="note">Peramban ini belum mendukung penilaian suara otomatis. Ucapkan kalimatnya dengan lantang, lalu tekan “Saya sudah mengucapkannya”.</p>'}`;
  document.getElementById('hear').onclick=()=>say(q.en);
  document.getElementById('slow').onclick=()=>say(q.en,{slow:true});
  setTimeout(()=>say(q.en),350);
  const mic=document.getElementById('mic'), fb=document.getElementById('fb'), nx=document.getElementById('next');
  const finish=(score,heardText)=>{
    ex.answered=true;
    document.getElementById('mtr').style.width=score+'%';
    document.getElementById('pct').textContent=score+'%';
    const ok=score>=70;
    fb.className='feedback on '+(ok?'good':'bad');
    fb.innerHTML=`<b>${ok?(score>=90?'Sempurna, '+S.name+'!':'Bagus sekali!'):'Ayo coba sekali lagi.'}</b>${ok?'Pengucapanmu sudah jelas.':'Dengarkan contohnya, perhatikan setiap kata, lalu ucapkan pelan-pelan.'}`;
    if(heardText!==undefined) document.getElementById('heard').innerHTML=`Terdengar: “${heardText}”`;
    if(ok){ ex.right++; addXP(10); S.speakDone++; save(); beep('good'); } else beep('bad');
    nx.style.display='block'; mic.classList.remove('live');
  };
  if(!SR){
    mic.textContent='✓';
    mic.onclick=()=>{ if(!ex.answered) finish(100); };
    mic.insertAdjacentHTML('afterend','<p class="muted" style="font-size:13px;margin-top:8px">Saya sudah mengucapkannya</p>');
  } else {
    mic.onclick=()=>{
      if(ex.answered) return;
      let r;
      try{ r=new SR(); }catch(e){ toast('Mikrofon tidak bisa dibuka.'); return; }
      r.lang=S.accent; r.interimResults=false; r.maxAlternatives=3;
      mic.classList.add('live'); document.getElementById('heard').textContent='Mendengarkan…';
      r.onresult=e=>{
        const alts=[...e.results[0]].map(a=>a.transcript);
        const best=alts.reduce((p,c)=>similarity(c,q.en)>similarity(p,q.en)?c:p,alts[0]);
        finish(similarity(best,q.en),best);
      };
      r.onerror=ev=>{
        mic.classList.remove('live');
        document.getElementById('heard').textContent='';
        toast(ev.error==='not-allowed'?'Izinkan akses mikrofon dulu ya.':'Suara belum terdengar. Coba lagi.');
      };
      r.onend=()=>mic.classList.remove('live');
      try{ r.start(); }catch(e){}
    };
  }
  nx.onclick=()=>nextOrFinish(u,'speak',u.speak.length,'Latihan berbicara');
}

/* ---------- 5. Kuis ---------- */
function vQuiz(u){
  const q=u.quiz[ex.i];
  body().innerHTML=`<div class="card">
     <div class="qnum">Pertanyaan ${ex.i+1} dari ${u.quiz.length} · Benar ${ex.right}</div>
     <div class="qtext">${q.q}</div>
     <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>
     <div class="feedback" id="fb"></div>
     <button class="btn primary wide" id="next" style="margin-top:14px;display:none">Lanjut</button>
   </div>`;
  body().querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(ex.answered) return; ex.answered=true;
    const ok=+b.dataset.i===q.a;
    body().querySelectorAll('.opt').forEach((x,i)=>{ if(i===q.a)x.classList.add('right'); else if(x===b)x.classList.add('wrong'); else x.classList.add('dim'); });
    const fb=document.getElementById('fb');
    fb.className='feedback on '+(ok?'good':'bad');
    fb.innerHTML=`<b>${ok?'Betul!':'Belum tepat.'}</b>${q.why}`;
    if(ok){ ex.right++; addXP(15); beep('good'); } else beep('bad');
    document.getElementById('next').style.display='block';
  });
  document.getElementById('next').onclick=()=>nextOrFinish(u,'quiz',u.quiz.length,'Kuis');
}

 {id:'b1', ic:'🌱', n:'Langkah Pertama', d:'Selesaikan 1 unit', ok:()=>unitsDone()>=1},

 {id:'b3', ic:'✏️', n:'Penulis Cilik', d:'Selesaikan 3 latihan tulis', ok:()=>ALLUNITS.filter(u=>secDone(u.id,'write')).length>=3},
 {id:'b4', ic:'🎤', n:'Suara Berani', d:'10 kalimat diucapkan dengan baik', ok:()=>S.speakDone>=10},
 {id:'b5', ic:'🔥', n:'Rajin 3 Hari', d:'Belajar 3 hari berturut-turut', ok:()=>S.streak>=3},

 {id:'b9', ic:'🏔️', n:'Penakluk Gunung Juara', d:'Selesaikan seluruh Level 3', ok:()=>LEVELS[2].units.every(u=>secDone(u.id,'quiz'))},

function checkBadges(){

function renderProfile(){
  const done=unitsDone(), got=BADGES.filter(b=>b.ok()).length;

    <div class="top">

      <div class="ic">${b.ic}</div><small>${b.n}</small>

          <div class="pbar" style="height:9px;margin-top:4px"><i style="width:${unitPct(u.id)}%"></i></div></div>

/* ================= SETELAN ================= */
function renderSettings(){
  app.innerHTML=`<section class="screen on">
    <h1 style="font-size:26px;margin-bottom:4px">Setelan</h1>
    <p class="muted" style="font-size:14px;margin:0 0 16px">Halaman ini bisa diatur bersama orang tua atau guru.</p>

    <div class="card" style="padding:16px">
      <h3>Profil</h3>
      <input class="namefield" id="nm" maxlength="14" value="${S.name}" style="max-width:100%;font-size:19px">
      <div class="pickrow">${Object.keys(CHARS).map(k=>`<button class="pick" data-ch2="${k}" aria-pressed="${S.char===k}">${charSVG(k)}<span>${CHARS[k].name.split(' ')[0]}</span></button>`).join('')}</div>
      <button class="btn primary wide" id="saveP" style="margin-top:8px">Simpan profil</button>
    </div>

    <div class="setrow"><div class="lb"><b>Efek suara</b><small>Bunyi saat menjawab benar atau salah</small></div>

    <div class="setrow"><div class="lb"><b>Aksen suara</b><small>Pilih logat pembaca kalimat</small></div>
      <select id="acc" style="padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:var(--display)">
        <option value="en-US" ${S.accent==='en-US'?'selected':''}>Amerika</option>
        <option value="en-GB" ${S.accent==='en-GB'?'selected':''}>Britania</option>
        <option value="en-AU" ${S.accent==='en-AU'?'selected':''}>Australia</option>
      </select></div>

    <div class="setrow"><div class="lb"><b>Kecepatan bicara</b><small>Makin kecil makin pelan</small></div>
      <input type="range" id="rt" min="0.5" max="1.1" step="0.02" value="${S.rate}" style="width:130px"></div>
    <button class="btn wide" id="testV" style="margin-bottom:10px">🔊 Coba suaranya</button>

    <div class="setrow"><div class="lb"><b>Buka semua unit</b><small>Untuk guru atau anak yang ingin melompati materi</small></div>
      <button class="toggle" id="tgAll" aria-pressed="${S.unlockAll}" aria-label="Buka semua unit"></button></div>

    <div class="setrow"><div class="lb"><b>Pasang di layar utama</b><small>Agar bisa dibuka seperti aplikasi, juga tanpa internet</small></div>
      <button class="btn" id="inst" style="font-size:14px;padding:10px 16px">Pasang</button></div>

    <button class="btn wide" id="reset" style="margin-top:14px;color:var(--coral)">Hapus semua progres</button>
    <p class="note" style="margin-top:14px">Grammar Quest bekerja penuh tanpa internet. Suara dibacakan oleh pembaca teks bawaan perangkat. Penilaian pengucapan memakai pengenal suara peramban; pada sebagian perangkat fitur ini membutuhkan koneksi.</p>
  </section>`;
  let pick=S.char;
  app.querySelectorAll('[data-ch2]').forEach(b=>b.onclick=()=>{
    pick=b.dataset.ch2; app.querySelectorAll('[data-ch2]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.ch2===pick)); beep();
  });
  document.getElementById('saveP').onclick=()=>{
    const v=document.getElementById('nm').value.trim();
    if(v.length<2){ toast('Nama minimal 2 huruf.'); return; }
    S.name=v.charAt(0).toUpperCase()+v.slice(1); S.char=pick; save(); beep('good'); toast('Profil tersimpan');
    renderSettings(); renderNav();
  };
  const tg=(el,key,after)=>{ el.onclick=()=>{ S[key]=!S[key]; save(); el.setAttribute('aria-pressed',S[key]); beep('good'); if(after)after(); }; };
  tg(document.getElementById('tgSound'),'sound');
  tg(document.getElementById('tgAll'),'unlockAll',()=>toast(S.unlockAll?'Semua unit terbuka':'Unit kembali berurutan'));
  document.getElementById('acc').onchange=e=>{ S.accent=e.target.value; save(); say('Hello '+S.name+', nice to meet you!'); };
  document.getElementById('rt').oninput=e=>{ S.rate=+e.target.value; save(); };
  document.getElementById('testV').onclick=()=>say(`Hello ${S.name}! Welcome to Grammar Quest. Let's learn English together.`);
  document.getElementById('inst').onclick=installPWA;
  document.getElementById('reset').onclick=()=>{
    if(confirm('Hapus semua progres dan mulai dari awal?')){ localStorage.removeItem(KEY); S=Object.assign({},DEFAULT); obStep=0; render(); }
  };
}

/* ================= PWA ================= */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e; });
function installPWA(){
  if(deferred){ deferred.prompt(); deferred.userChoice.then(()=>{deferred=null;}); return; }
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
  toast(ios?'Di Safari: tombol Bagikan → Tambah ke Layar Utama':'Buka menu peramban → Instal aplikasi / Tambah ke layar utama');
}
function buildManifest(){
  if(document.querySelector('link[rel="manifest"]')) return;
  try{
    const c=document.createElement('canvas'); c.width=c.height=192;
    const x=c.getContext('2d');
    x.fillStyle='#12313F'; x.fillRect(0,0,192,192);
    x.fillStyle='#FFB020'; x.beginPath(); x.arc(96,96,64,0,7); x.fill();
    x.fillStyle='#12313F'; x.font='bold 84px sans-serif'; x.textAlign='center'; x.textBaseline='middle';
    x.fillText('G',96,102);
    const icon=c.toDataURL('image/png');
    const m={name:'Grammar Quest',short_name:'Grammar Quest',start_url:'.',scope:'.',display:'standalone',
      background_color:'#E6F1EF',theme_color:'#12313F',orientation:'portrait',lang:'id',
      description:'Belajar grammar Bahasa Inggris untuk anak 7–12 tahun.',
      icons:[{src:icon,sizes:'192x192',type:'image/png',purpose:'any maskable'}]};
    const link=document.createElement('link');
    link.rel='manifest'; link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));
    document.head.appendChild(link);
  }catch(e){}
}
buildManifest();
if('serviceWorker' in navigator && location.protocol!=='blob:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ================= MULAI ================= */
document.addEventListener('click',()=>{ try{ if(AC&&AC.state==='suspended')AC.resume(); }catch(e){} },{once:true});
window.addEventListener('beforeunload',save);
render();
checkBadges();
